respect-type-ignore-comments = false
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ty.environment]
extra-paths = ["./typings"]
python-platform = "all"
# === OK_EDIT: path-sync shared ===

[tool.updateCitation]
filenameCitationDOTcff = "CITATION.cff"
pathFilenameCitationSSOT = "citations/CITATION.cff"

[tool.uv]
default-groups = ["dev", "testing"]

[[tool.uv.index]]
explicit = true
name = "indexPytorch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "indexPytorch", group = "pytorch" }
torchaudio = { index = "indexPytorch", group = "pytorch" }
